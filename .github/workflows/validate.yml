name: Validate audit skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so the secret scan covers every commit
      - name: Run guard and security-gate tests
        run: python3 -m unittest discover -s tests -v
      - name: Run sample acceptance tests
        run: python3 -m unittest discover -s examples/memo-tool/tests -v
      - name: Validate reproducible audit bundle
        run: python3 scripts/audit_guard.py validate-bundle examples/memo-tool
      - name: Verify generated views are not stale vs source
        # Generated atlas/critical-review views are excluded from the seal, so this
        # machine check catches them drifting from memo.py (3-AI review 2026-08).
        run: |
          python3 scripts/audit_guard.py verify-atlas \
            examples/memo-tool/atlas/index.html examples/memo-tool/memo.py
          python3 scripts/audit_guard.py verify-atlas \
            examples/memo-tool/critical-review/index.html examples/memo-tool/memo.py
      - name: Secret scan (gitleaks, whole history)
        # Machine-enforced, not doc-only: gitleaks scans the repo (respecting the
        # committed .gitleaks.toml allowlist of intentional test fixtures) and fails
        # CI on any real leak (3-AI review 2026-08).
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --no-banner --config /repo/.gitleaks.toml
      - name: Dependency vulnerability scan (osv-scanner)
        # Machine-connected SCA: osv-scanner runs in a pinned container and its
        # JSON is graded by the bundled scan-deps, which fails CI on Critical/High.
        # A scanner CRASH must NOT be read as clean (3-AI review 2026-08, Codex):
        # exit 128 = no packages to scan (pass); any other non-0/1 = fail the job.
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/google/osv-scanner:v2.5.1 \
            scan --format json -r /repo > /tmp/osv.json 2>/tmp/osv.err
          rc=$?
          set -e
          if [ "$rc" = "128" ]; then
            echo "osv-scanner: no dependency manifests found; nothing to scan."
            exit 0
          fi
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then
            echo "osv-scanner failed (exit $rc); NOT clean:"; cat /tmp/osv.err; exit 1
          fi
          python3 scripts/security_gate.py scan-deps . --results /tmp/osv.json
